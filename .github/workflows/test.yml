name: Unit Tests

on:
  push:
    branches:
      - 'feature/*'
      - 'develop'
  pull_request:
    branches:
      - 'develop'

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Deno
      uses: denoland/setup-deno@v1
      with:
        deno-version: 2.4.2

    - name: Run server tests
      run: deno test --allow-all server/

    - name: Install client dependencies
      run: deno cache --node-modules-dir --lock=deno.lock --lock-write client/deno.json
      
    - name: Run client tests
      run: deno task --cwd client test
